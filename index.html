<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Passinho" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Passinho – Dance Class Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Show any JS error on-screen — useful when mobile DevTools aren't available
      window.onerror = function(msg, src, line, col, err) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:#f87171;font-family:monospace;font-size:13px;word-break:break-word">' +
          '<div style="font-size:24px;margin-bottom:12px">💥 JS load error</div>' +
          '<b>' + msg + '</b><br><br>' + src + ' ' + line + ':' + col +
          (err ? '<br><br><pre style="white-space:pre-wrap;opacity:.7">' + err.stack + '</pre>' : '') +
          '</div>'
      }
      window.onunhandledrejection = function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:#f87171;font-family:monospace;font-size:13px;word-break:break-word">' +
          '<div style="font-size:24px;margin-bottom:12px">💥 Unhandled promise</div>' +
          '<b>' + String(e.reason) + '</b>' +
          '</div>'
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
